---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-nfs
spec:
  storageClassName: synology-csi-nfs
  capacity:
    storage: 50Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.1.4
    path: /volume2/photo
  mountOptions: ["nfsvers=4.1", "nconnect=8", "hard", "noatime"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-nfs
  namespace: media
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: synology-csi-nfs
  resources:
    requests:
      storage: 50Gi
