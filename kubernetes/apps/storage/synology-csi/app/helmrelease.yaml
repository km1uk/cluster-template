---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: synology-csi
  namespace: synology-csi
spec:
  interval: 30m
  chart:
    spec:
      chart: synology-csi
      version: 0.9.4
      sourceRef:
        kind: HelmRepository
        name: synology-csi-chart
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    clientInfoSecret:
      create: false
      name: synology-csi-client-info
    storageClasses:
      synology-csi-delete:
        reclaimPolicy: Delete
        parameters:
          dsm: 192.168.1.4
          fsType: btrfs
          location: /volume2
          protocol: iscsi
      synology-csi-retain:
        isDefault: true
        reclaimPolicy: Retain
        parameters:
          dsm: 192.168.1.4
          fsType: btrfs
          location: /volume2
          protocol: iscsi
