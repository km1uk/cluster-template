---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tandoor-external-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tandoor-external-secret
    template:
      data:
        # App
        SECRET_KEY: "{{ .TANDOOR_SECRET_KEY }}"
        # OIDC
        SOCIALACCOUNT_PROVIDERS: |-
          {
            "openid_connect": {
                "OAUTH_PKCE_ENABLED": true,
                "APPS": [
                    {
                        "provider_id": "authentik",
                        "name": "Authentik",
                        "client_id": "{{ .TANDOOR_CLIENT_ID }}",
                        "secret": "{{ .TANDOOR_CLIENT_SECRET }}",
                        "settings": {
                            "server_url": "https://auth.${SECRET_DOMAIN}/.well-known/openid-configuration"
                        }
                    }
                ]
            }
          }
        # Database
        POSTGRES_HOST: &dbhost "{{ .POSTGRESQL_HOST }}"
        POSTGRES_PORT: "{{ .POSTGRESQL_PORT }}"
        POSTGRES_USER: &dbuser "{{ .TANDOOR_POSTGRES_USER }}"
        POSTGRES_PASSWORD: &dbpass "{{ .TANDOOR_POSTGRES_PASSWORD }}"
        POSTGRES_DB: &dbname "{{ .TANDOOR_POSTGRES_DB }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRESQL_SUPERUSER_PASS }}"
  dataFrom:
    - extract:
        key: postgresql-external-secret
    - extract:
        key: tandoor-external-secret
    - extract:
        key: homelab-external-secret
